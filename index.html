<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Expert Trading Pro - Capture graphique</title>

    <script src="https://s3.tradingview.com/tv.js"></script>
    <link rel="stylesheet" href="style.css">

    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            min-height: 100%;
            background: #020617;
            color: #e5e7eb;
            font-family: Arial, Helvetica, sans-serif;
            overflow-x: hidden;
        }

        body.auth-locked {
            overflow: hidden;
        }

        body.auth-locked .header-gr,
        body.auth-locked #chart-container,
        body.auth-locked #result-panel {
            display: none !important;
        }

        .auth-screen {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: radial-gradient(circle at top, #1e293b, #020617 62%);
            padding: 20px;
            box-sizing: border-box;
        }

        body:not(.auth-locked) .auth-screen {
            display: none !important;
        }

        .auth-box {
            width: 100%;
            max-width: 390px;
            background: rgba(15, 23, 42, 0.96);
            border: 1px solid #334155;
            border-radius: 16px;
            padding: 22px;
            box-shadow: 0 18px 50px rgba(0, 0, 0, 0.55);
            box-sizing: border-box;
        }

        .auth-box h2 {
            margin: 0 0 8px 0;
            color: #facc15;
            font-size: 21px;
        }

        .auth-box p {
            margin: 0 0 18px 0;
            color: #cbd5e1;
            font-size: 14px;
        }

        .auth-box label {
            display: block;
            margin: 12px 0 6px 0;
            color: #facc15;
            font-weight: 700;
            font-size: 13px;
        }

        .auth-box input {
            width: 100%;
            box-sizing: border-box;
            padding: 11px 12px;
            border-radius: 10px;
            border: 1px solid #475569;
            background: #020617;
            color: #ffffff;
            outline: none;
        }

        .auth-box button {
            width: 100%;
            margin-top: 18px;
            padding: 11px 14px;
            border-radius: 10px;
            border: 1px solid #eab308;
            background: #facc15;
            color: #111827;
            font-weight: 800;
            cursor: pointer;
        }

        .auth-message {
            margin-top: 12px;
            min-height: 18px;
            font-size: 13px;
            color: #fecaca;
            white-space: pre-line;
        }

        .header-gr {
            position: sticky;
            top: 0;
            z-index: 1000;
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 6px 10px;
            background: rgba(2, 6, 23, 0.98);
            border-bottom: 1px solid #334155;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.55);
            box-sizing: border-box;
        }

        .header-gr h1 {
            margin: 0;
            font-size: 15px;
            color: #facc15;
            white-space: nowrap;
        }

        .header-gr .spacer {
            flex: 1 1 auto;
        }

        .header-gr button,
        .header-gr a button {
            height: 30px;
            padding: 4px 10px;
            border-radius: 8px;
            border: 1px solid #475569;
            background: #111827;
            color: #e5e7eb;
            font-size: 12px;
            font-weight: 800;
            cursor: pointer;
        }

        .header-gr .btn-capture {
            background: #facc15;
            color: #111827;
            border-color: #eab308;
        }

        .header-gr button:disabled {
            opacity: 0.65;
            cursor: not-allowed;
        }

        #chart-container {
            width: 100%;
            height: calc(100vh - 43px);
            min-height: 560px;
            background: #020617;
            position: relative;
        }

        #tradingview_chart {
            width: 100%;
            height: 100%;
            min-height: 560px;
            background: #020617;
        }

        #tradingview_chart iframe {
            width: 100% !important;
            height: 100% !important;
            min-height: 560px !important;
            border: 0 !important;
            display: block;
        }

        .chart-message {
            position: absolute;
            left: 12px;
            top: 12px;
            z-index: 20;
            display: none;
            color: #facc15;
            background: rgba(2, 6, 23, 0.88);
            border: 1px solid #334155;
            border-radius: 8px;
            padding: 8px 10px;
            font-size: 12px;
            max-width: calc(100% - 24px);
            box-sizing: border-box;
        }

        #result-panel {
            margin: 10px;
            border: 1px solid #334155;
            border-radius: 10px;
            background: rgba(15, 23, 42, 0.95);
            overflow: hidden;
        }

        .result-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            padding: 8px 10px;
            border-bottom: 1px solid #334155;
            color: #facc15;
            font-size: 13px;
            font-weight: 800;
        }

        .status-line {
            padding: 8px 10px;
            color: #cbd5e1;
            font-size: 12px;
        }

        #resultat-capture {
            margin: 0;
            padding: 10px;
            max-height: 180px;
            overflow: auto;
            color: #e5e7eb;
            font-size: 12px;
            white-space: pre-wrap;
        }

        .hidden {
            display: none !important;
        }

        @media (max-width: 700px) {
            .header-gr {
                flex-wrap: wrap;
            }

            .header-gr h1 {
                width: 100%;
            }

            #chart-container {
                height: 620px;
            }
        }
    </style>
</head>
<body class="auth-locked">

    <div id="auth-screen" class="auth-screen">
        <form class="auth-box" onsubmit="connexionUtilisateur(event)">
            <h2>Connexion Expert Trading</h2>
            <p>Veuillez vous authentifier pour capturer le graphique.</p>

            <label for="auth-username">Utilisateur</label>
            <input id="auth-username" type="text" autocomplete="username" required>

            <label for="auth-password">Mot de passe</label>
            <input id="auth-password" type="password" autocomplete="current-password" required>

            <button type="submit" id="auth-login-btn">Se connecter</button>
            <div id="auth-message" class="auth-message"></div>
        </form>
    </div>

    <div class="header-gr">
        <h1>EXPERT TRADING PRO - CAPTURE GRAPHIQUE</h1>
        <div class="spacer"></div>
        <button class="btn-capture" id="btn-capture" type="button" onclick="takeScreenshot()" title="Capturer uniquement l'image affichée du graphique TradingView.">📷 Capturer l’image</button>
        <a href="analyse.html" target="_blank" rel="noopener noreferrer" title="Ouvrir la page d’analyse des captures.">
            <button type="button">Analyser</button>
        </a>
        <button type="button" onclick="togglePanel()">Résultat</button>
    </div>

    <div id="chart-container">
        <div id="chart-message" class="chart-message">Chargement du graphique TradingView...</div>
        <div id="tradingview_chart"></div>
    </div>

    <div id="result-panel">
        <div class="result-header">
            <span>Résultat capture</span>
            <span>Image seule</span>
        </div>
        <div id="status" class="status-line">Prêt.</div>
        <pre id="resultat-capture">Aucune capture lancée.</pre>
    </div>

    <script>
        const AUTH_TOKEN_KEY = "expert_trading_auth_token";
        const AUTH_TOKEN_KEYS_COMPATIBLES = [
            "expert_trading_auth_token",
            "expertTradingToken",
            "expertTradingAuthToken"
        ];

        const API_BASE_URL = window.location.hostname.includes("github.io")
            ? "https://expert-trading.onrender.com"
            : "";

        let applicationDejaInitialisee = false;
        let tradingViewWidget = null;
        let dernierScreenshotBase64 = null;

        function getApiUrl(route) {
            return API_BASE_URL + route;
        }

        function afficherStatus(message) {
            const zone = document.getElementById("status");
            if (zone) zone.textContent = message || "";
        }

        function afficherMessageAuth(message) {
            const zone = document.getElementById("auth-message");
            if (zone) zone.textContent = message || "";
        }

        function afficherResultat(data) {
            const zone = document.getElementById("resultat-capture");
            if (!zone) return;
            zone.textContent = typeof data === "string" ? data : JSON.stringify(data, null, 2);
        }

        function afficherMessageGraphique(message, type) {
            const zone = document.getElementById("chart-message");
            if (!zone) return;

            zone.textContent = message || "";
            zone.style.display = message ? "block" : "none";
            zone.style.color = type === "erreur" ? "#fecaca" : "#facc15";
            zone.style.borderColor = type === "erreur" ? "#7f1d1d" : "#334155";
        }

        function obtenirTokenAuth() {
            for (const cle of AUTH_TOKEN_KEYS_COMPATIBLES) {
                const token = localStorage.getItem(cle);
                if (token && String(token).trim() !== "") return token;
            }
            return "";
        }

        function enregistrerTokenAuth(token) {
            AUTH_TOKEN_KEYS_COMPATIBLES.forEach(cle => localStorage.setItem(cle, token));
        }

        function supprimerTokenAuth() {
            AUTH_TOKEN_KEYS_COMPATIBLES.forEach(cle => localStorage.removeItem(cle));
        }

        function afficherEcranConnexion(message = "") {
            document.body.classList.add("auth-locked");
            afficherMessageAuth(message);
            const champ = document.getElementById("auth-username");
            if (champ) setTimeout(() => champ.focus(), 50);
        }

        function masquerEcranConnexion() {
            document.body.classList.remove("auth-locked");
            afficherMessageAuth("");
        }

        function initialiserApplicationUneSeuleFois() {
            if (applicationDejaInitialisee) return;
            applicationDejaInitialisee = true;
            init();
        }

        async function lireReponseJson(response) {
            const texte = await response.text();
            let data;

            try {
                data = texte ? JSON.parse(texte) : {};
            } catch (erreur) {
                throw new Error("Le serveur n'a pas retourné du JSON valide. Statut HTTP : " + response.status);
            }

            if (!response.ok || data.ok === false) {
                throw new Error(data.details || data.message || data.error || "Erreur HTTP " + response.status);
            }

            return data;
        }

        async function fetchAuth(url, options = {}) {
            const token = obtenirTokenAuth();
            const headers = new Headers(options.headers || {});

            if (token) headers.set("Authorization", "Bearer " + token);

            const response = await fetch(url, {
                ...options,
                headers
            });

            if (response.status === 401) {
                supprimerTokenAuth();
                afficherEcranConnexion("Session absente ou expirée. Veuillez vous reconnecter.");
            }

            return response;
        }

        async function verifierSessionUtilisateur() {
            const token = obtenirTokenAuth();

            if (!token) {
                afficherEcranConnexion("");
                return false;
            }

            try {
                const response = await fetch(getApiUrl("/api/auth/me"), {
                    method: "GET",
                    mode: "cors",
                    cache: "no-store",
                    headers: {
                        "Accept": "application/json",
                        "Authorization": "Bearer " + token
                    }
                });

                const data = await lireReponseJson(response);

                if (data.ok === true) {
                    masquerEcranConnexion();
                    return true;
                }

                throw new Error(data.message || "Session invalide.");
            } catch (erreur) {
                supprimerTokenAuth();
                afficherEcranConnexion("Veuillez vous authentifier.");
                return false;
            }
        }

        async function connexionUtilisateur(event) {
            event.preventDefault();

            const bouton = document.getElementById("auth-login-btn");
            const username = document.getElementById("auth-username").value.trim();
            const password = document.getElementById("auth-password").value;

            afficherMessageAuth("");

            if (!username || !password) {
                afficherMessageAuth("Utilisateur et mot de passe requis.");
                return;
            }

            try {
                if (bouton) bouton.disabled = true;

                const response = await fetch(getApiUrl("/api/auth/login"), {
                    method: "POST",
                    mode: "cors",
                    cache: "no-store",
                    headers: {
                        "Content-Type": "application/json",
                        "Accept": "application/json"
                    },
                    body: JSON.stringify({ username, password })
                });

                const data = await lireReponseJson(response);

                if (!data.token) throw new Error("Token absent dans la réponse du serveur.");

                enregistrerTokenAuth(data.token);
                masquerEcranConnexion();
                initialiserApplicationUneSeuleFois();
            } catch (erreur) {
                supprimerTokenAuth();
                afficherEcranConnexion("Connexion impossible.\n" + erreur.message);
            } finally {
                if (bouton) bouton.disabled = false;
            }
        }

        async function demarrerApplication() {
            document.body.classList.add("auth-locked");
            const sessionOk = await verifierSessionUtilisateur();
            if (sessionOk) initialiserApplicationUneSeuleFois();
        }

        function init() {
            if (typeof TradingView === "undefined" || typeof TradingView.widget !== "function") {
                afficherMessageGraphique("La bibliothèque TradingView tv.js n'est pas chargée.", "erreur");
                afficherStatus("Erreur : bibliothèque TradingView tv.js absente.");
                return;
            }

            creerGraphiqueTradingView();
        }

        function creerGraphiqueTradingView() {
            const conteneur = document.getElementById("tradingview_chart");
            if (!conteneur) return;

            afficherMessageGraphique("Chargement du graphique TradingView...", "attente");
            afficherStatus("Chargement du graphique TradingView...");
            conteneur.innerHTML = "";

            tradingViewWidget = new TradingView.widget({
                autosize: true,
                symbol: "BINANCE:BTCUSDT",
                interval: "D",
                range: "12M",
                timezone: "Etc/UTC",
                theme: "dark",
                style: "1",
                locale: "fr",
                enable_publishing: false,
                allow_symbol_change: true,
                hide_top_toolbar: false,
                hide_side_toolbar: false,
                save_image: false,
                container_id: "tradingview_chart"
            });

            setTimeout(() => {
                window.dispatchEvent(new Event("resize"));
                afficherMessageGraphique("", "ok");
                afficherStatus("Graphique TradingView chargé. Utilisez le graphique directement, puis cliquez sur Capturer l’image.");
            }, 700);
        }

        function genererTimestampFichier() {
            const maintenant = new Date();
            const annee = maintenant.getFullYear();
            const mois = String(maintenant.getMonth() + 1).padStart(2, "0");
            const jour = String(maintenant.getDate()).padStart(2, "0");
            const heure = String(maintenant.getHours()).padStart(2, "0");
            const minute = String(maintenant.getMinutes()).padStart(2, "0");
            const seconde = String(maintenant.getSeconds()).padStart(2, "0");
            return annee + mois + jour + "-" + heure + minute + seconde;
        }

        function compresserCanvasPourIA(canvas, largeurMax = 1280, qualite = 0.75) {
            if (!canvas || !canvas.width || !canvas.height) {
                throw new Error("Canvas invalide pour compression.");
            }

            const ratio = Math.min(1, largeurMax / canvas.width);
            const largeur = Math.max(1, Math.round(canvas.width * ratio));
            const hauteur = Math.max(1, Math.round(canvas.height * ratio));
            const sortie = document.createElement("canvas");

            sortie.width = largeur;
            sortie.height = hauteur;

            const ctx = sortie.getContext("2d");
            ctx.drawImage(canvas, 0, 0, largeur, hauteur);

            return sortie.toDataURL("image/jpeg", qualite);
        }

        async function capturerCanvasEnBase64() {
            if (!navigator.mediaDevices || typeof navigator.mediaDevices.getDisplayMedia !== "function") {
                throw new Error("La capture d'écran du navigateur n'est pas disponible. Utilisez Chrome ou Edge en HTTPS.");
            }

            afficherStatus("Sélectionnez l'onglet ou la fenêtre contenant le graphique TradingView.");

            const flux = await navigator.mediaDevices.getDisplayMedia({
                video: {
                    displaySurface: "browser",
                    cursor: "always"
                },
                audio: false,
                preferCurrentTab: true
            });

            try {
                const video = document.createElement("video");
                video.srcObject = flux;
                video.muted = true;
                video.playsInline = true;

                await new Promise((resolve, reject) => {
                    video.onloadedmetadata = () => video.play().then(resolve).catch(reject);
                    video.onerror = () => reject(new Error("Impossible de lire la capture vidéo."));
                });

                await new Promise(resolve => setTimeout(resolve, 350));

                const largeur = video.videoWidth || window.innerWidth;
                const hauteur = video.videoHeight || window.innerHeight;

                if (!largeur || !hauteur) throw new Error("Dimensions de capture invalides.");

                const canvas = document.createElement("canvas");
                canvas.width = largeur;
                canvas.height = hauteur;

                const ctx = canvas.getContext("2d");
                ctx.drawImage(video, 0, 0, largeur, hauteur);

                return compresserCanvasPourIA(canvas, 1280, 0.75);
            } finally {
                flux.getTracks().forEach(track => track.stop());
            }
        }

        function creerPayloadImageSeule(imageBase64) {
            const nomCapture = "GRAPHIQUE-IMAGE-SEULE-" + genererTimestampFichier();

            return {
                actif: "IMAGE_SEULE",
                indicateur: null,
                intervalle: null,
                actif_libelle: "Image seule",
                indicateur_libelle: null,
                intervalle_libelle: null,
                source_parametres: "capture_image_seule",
                lecture_directe_graphique: false,
                parametres_a_lire_depuis_capture: false,
                type_bougie: null,
                type_bougie_libelle: null,
                nom_fichier: nomCapture,
                nom_capture: nomCapture,
                categorie_analyse: "Image seule",
                categorieAnalyse: "Image seule",
                configuration_json: {
                    nom: "Expert Trading Pro - Capture graphique",
                    type: "capture_image_seule",
                    commentaire: "Aucun paramètre personnalisé. Seule l'image affichée est capturée.",
                    tradingView: {
                        widgetPresent: true,
                        bibliotheque: "TradingView tv.js",
                        lectureParametres: false
                    },
                    dateConfiguration: new Date().toISOString()
                },
                screenshot_base64: imageBase64,
                screenshotBase64: imageBase64,
                image: imageBase64
            };
        }

        function obtenirUrlsSauvegardeCapture() {
            const base = API_BASE_URL || window.location.origin;
            return [base + "/api/captures"];
        }

        async function enregistrerImageSurServeur(imageBase64) {
            const payload = creerPayloadImageSeule(imageBase64);
            const urls = obtenirUrlsSauvegardeCapture();
            let derniereErreur = null;

            for (const url of urls) {
                try {
                    const response = await fetchAuth(url, {
                        method: "POST",
                        mode: "cors",
                        credentials: "omit",
                        cache: "no-store",
                        headers: {
                            "Content-Type": "application/json",
                            "Accept": "application/json"
                        },
                        body: JSON.stringify(payload)
                    });

                    const data = await lireReponseJson(response);

                    return {
                        ok: true,
                        routeUtilisee: url,
                        payloadEnvoye: {
                            ...payload,
                            screenshot_base64: "[image base64 masquée]",
                            screenshotBase64: "[image base64 masquée]",
                            image: "[image base64 masquée]"
                        },
                        reponseServeur: data
                    };
                } catch (erreur) {
                    derniereErreur = erreur;
                    console.warn("Sauvegarde image échouée sur", url, erreur);
                }
            }

            throw new Error("Aucune route de sauvegarde n'a accepté l'image. Dernière erreur : " + (derniereErreur ? derniereErreur.message : "inconnue"));
        }

        async function takeScreenshot() {
            const bouton = document.getElementById("btn-capture");

            try {
                if (bouton) bouton.disabled = true;

                afficherStatus("Capture de l'image en cours...");
                dernierScreenshotBase64 = await capturerCanvasEnBase64();

                const resultat = await enregistrerImageSurServeur(dernierScreenshotBase64);

                afficherResultat(resultat);
                afficherStatus("Image sauvegardée dans PostgreSQL.");

                const idCapture = resultat?.reponseServeur?.capture?.id || "non retourné";
                const nomCapture = resultat?.reponseServeur?.capture?.nom_capture || resultat?.payloadEnvoye?.nom_capture || "capture";

                alert(
                    "Capture réussie.\n\n" +
                    "Image sauvegardée dans PostgreSQL.\n" +
                    "Nom : " + nomCapture + "\n" +
                    "ID : " + idCapture
                );

                return dernierScreenshotBase64;
            } catch (erreur) {
                console.error("Erreur capture image :", erreur);
                afficherStatus("Erreur capture : " + erreur.message);
                alert("Erreur capture.\n\n" + erreur.message);
                return null;
            } finally {
                if (bouton) bouton.disabled = false;
            }
        }

        function togglePanel() {
            const panel = document.getElementById("result-panel");
            if (panel) panel.classList.toggle("hidden");
        }

        window.addEventListener("load", demarrerApplication);
        window.addEventListener("resize", () => window.dispatchEvent(new Event("resize")));
    </script>
</body>
</html>
